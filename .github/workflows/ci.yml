name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          SATELLITE_MOCK_MODE: "true"
          NEXT_PUBLIC_APP_NAME: RoadEye AI
          NEXT_PUBLIC_APP_URL: http://localhost:3000
